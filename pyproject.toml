[project]
name = "rag-eval-harness"
version = "0.1.0"
description = "RAG pipeline over FastAPI GitHub Discussions Q&A, with a RAGAS-based eval harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "chromadb>=0.5",
    "fastembed>=0.8",
    "ragas>=0.2,<0.4",
    "datasets>=2.20",
    "langchain-ollama>=0.2",
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "langchain-google-genai>=2.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "typer>=0.12",
    "langchain-community<0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored FastAPI docs snippets (scripts/fetch_corpus.py), not our code --
# don't lint or fix someone else's docs_src.
extend-exclude = ["data/corpus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: not run by default; determinism/long-running checks",
    "integration: hits the FastAPI app or a real service",
    "llm: calls a real LLM API; costs quota/money",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
