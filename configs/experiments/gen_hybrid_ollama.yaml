# Generation A/B, arm 1: the weak CPU-local generator (docs/plan.md Phase 8
# Verify -- "judge two runs differing only in generator"). Retrieval is the
# pinned hybrid+rerank config; only generation.llm differs from gen_hybrid_groq.
name: exp-gen-ollama
extends: hybrid_rerank.yaml

generation:
  enabled: true
  llm:
    # Meta-Llama-3.1-8B-Instruct, Q4 GGUF -- see Modelfile.fdm-llama (repo
    # root) to recreate this local Ollama tag; `ollama create fdm-llama -f
    # Modelfile.fdm-llama` before running this config.
    provider: ollama
    model: fdm-llama

eval:
  # discussions_gen_v1: answer quality / faithfulness only, own chunk excluded.
  datasets: [discussions_gen_v1]
  judge:
    enabled: true
