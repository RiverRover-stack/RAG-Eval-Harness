# Render Blueprint (https://render.com/docs/blueprint-spec) -- deploy config
# as code, replacing the Hugging Face Space YAML front-matter this project
# used to carry in deploy/space/README.md.
#
# autoDeploy is deliberately off: .github/workflows/deploy.yml calls this
# service's Deploy Hook only after CI is green on main (docs/plan.md Phase
# 3: "never deploys an unvalidated commit"). Render's own push-triggered
# auto-deploy would bypass that gate.
services:
  - type: web
    name: rag-eval-harness
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
