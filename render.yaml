# Render Blueprint (https://render.com/docs/blueprint-spec) -- deploy config
# as code, replacing the Hugging Face Space YAML front-matter this project
# used to carry in deploy/space/README.md.
#
# No GitHub Actions deploy workflow needed: the service's Auto-Deploy
# setting is "After CI Checks Pass" (Render dashboard -> Settings -> Build &
# Deploy), which makes Render itself wait for the CI workflow's status
# check to go green on a commit before deploying it -- the same "never
# deploys an unvalidated commit" rule (docs/plan.md Phase 3), with no extra
# workflow or Deploy Hook secret to maintain. That setting isn't set from
# this file today (the service was created via Render's manual "New Web
# Service" form, not a Blueprint sync) -- this file documents the intended
# config; keep it in sync with the dashboard by hand until/unless the
# service is re-created from this Blueprint.
services:
  - type: web
    name: rag-eval-harness
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    # /ready (not bare /health) is the actual runtime guard (docs/plan.md
    # Phase 3): it 503s if the baked index is missing/empty/mismatched,
    # which /api/health alone would report "ok" straight through.
    healthCheckPath: /api/health/ready
    envVars:
      - key: GROQ_API_KEY
        sync: false
