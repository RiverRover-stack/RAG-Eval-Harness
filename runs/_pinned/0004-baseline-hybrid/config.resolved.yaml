name: ci
corpus:
  sources:
  - docs
  - discussions
  snapshot: data/corpus/SNAPSHOT.json
embedding:
  provider: fastembed
  model: BAAI/bge-small-en-v1.5
retrieval:
  top_k: 5
  candidates_k: 30
  dense:
    enabled: true
  bm25:
    enabled: true
    k1: 1.2
    b: 0.75
  fusion:
    method: rrf
    rrf_k: 60
  rerank:
    enabled: false
    model: Xenova/ms-marco-MiniLM-L-6-v2
    top_n: 5
  query_rewrite:
    enabled: false
    mode: hyde
    n: 1
  parent_expansion:
    enabled: false
    mode: section
    max_tokens: 1200
  per_source_caps:
    docs: 4
    discussions: 2
generation:
  enabled: false
  llm:
    provider: groq
    model: llama-3.3-70b-versatile
    temperature: 0.0
    max_tokens: 900
  prompt_version: v2-cited
  require_citations: true
  groundedness:
    enabled: true
    mode: embedding_support
    abstain_below: 0.45
eval:
  datasets:
  - docs_synth_v1
  - discussions_v2
  k_values:
  - 1
  - 3
  - 5
  - 10
  self_retrieval: holdout
  judge:
    enabled: false
    provider: gemini
    model: gemini-2.5-flash
    max_workers: 1
  thresholds:
    recall_at_5:
      min: 0.7
      regression_tolerance: 0.02
    mrr:
      min: 0.55
      regression_tolerance: 0.02
    ndcg_at_10:
      min: 0.6
      regression_tolerance: 0.02
