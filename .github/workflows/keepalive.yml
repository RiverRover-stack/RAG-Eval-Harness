name: Keep App Awake

# Render's free tier spins down after 15 minutes of inactivity; the next
# request pays a cold-start cost (docs/plan.md Phase 3), which makes a
# recruiter's first click look broken. Ping every 10 minutes to keep it warm
# (well under the 15-minute idle window).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Curl the app's health endpoint
        env:
          APP_URL: ${{ vars.APP_URL }} # e.g. "https://rag-eval-harness.onrender.com" -- set as a repo *variable*, not a secret, it's not sensitive
        run: |
          if [ -z "${APP_URL:-}" ]; then
            echo "::warning::vars.APP_URL is not set -- nothing to ping yet."
            exit 0
          fi
          curl -fsS "${APP_URL%/}/api/health" || echo "::warning::App did not respond (likely cold-starting)."
