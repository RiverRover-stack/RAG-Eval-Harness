name: Keep Space Awake

# Hugging Face's free CPU tier sleeps after inactivity; a cold start takes
# 20-40s (docs/plan.md Phase 3), which makes a recruiter's first click look
# broken. Ping every 6 hours to keep it warm.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Curl the Space's health endpoint
        env:
          SPACE_URL: ${{ vars.SPACE_URL }} # e.g. "https://your-username-rag-eval-harness.hf.space" -- set as a repo *variable*, not a secret, it's not sensitive
        run: |
          if [ -z "${SPACE_URL:-}" ]; then
            echo "::warning::vars.SPACE_URL is not set -- nothing to ping yet."
            exit 0
          fi
          curl -fsS "${SPACE_URL%/}/api/health" || echo "::warning::Space did not respond (likely cold-starting)."
