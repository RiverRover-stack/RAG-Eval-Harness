name: Deploy to Render

# Runs only after CI has gone green on main -- never deploys an unvalidated
# commit (docs/plan.md Phase 3: "on main after CI green").
#
# Render's own GitHub integration builds the Dockerfile directly from this
# repo (respecting .dockerignore -- no curated push directory needed, unlike
# the old Hugging Face Space target). Auto-deploy is left OFF on the Render
# service itself; this workflow's only job is to call the service's Deploy
# Hook once CI is green, so an unvalidated commit is never deployed.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL repo secret must be set before this workflow can deploy."
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
